name: Release

# 触发方式:
#   1. 推送形如 v0.1.0 的 tag 时自动构建并发布 Release
#   2. 在 GitHub 网页 Actions 页手动点击运行(workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 允许 workflow 创建 Release(上传安装包)
permissions:
  contents: write

# 让 checkout/setup-node/pnpm 等 action 用 Node 24 运行时,消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # 前置:删除同名旧 draft Release(只删 Release,保留 tag)。
  # 反复重跑同一个 tag 时,旧草稿里残留的同名资产会让上传报 already_exists;
  # 先删干净,后面三平台的 tauri-action 会重新创建草稿并上传,流程可重复运行。
  # 在 ubuntu runner 上 gh CLI 已预装,GH_TOKEN 即仓库自带 token。
  prepare-release:
    runs-on: ubuntu-22.04
    steps:
      - name: 删除同名旧 draft Release(保留 tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --yes || echo "没有同名 Release,跳过删除"

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS:同时产出 Apple Silicon + Intel 的通用包
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Windows:只用 NSIS 产出 .exe 安装器(沿用,稳妥;不折腾 WiX msi)
          - platform: windows-latest
            args: "--bundles nsis"
          # Linux:产出 .AppImage / .deb
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # Linux 端 Tauri 需要的系统依赖(WebKitGTK 等)
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用包需要同时安装两个架构的 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Rust 编译产物,加速后续构建
      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 仅 macOS:把 App Store Connect API Key(.p8,base64 存在 secret 里)写成文件,
      # 供公证使用;路径通过 GITHUB_ENV 传给后续步骤。
      - name: 准备 macOS 公证 API Key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      # 更新签名的私钥与密码:粘贴进 GitHub Secret 时常被带上尾部换行(\n)。
      #   • 私钥带换行 → base64 解码失败("Invalid symbol 10")
      #   • 密码带换行 → 密码不匹配("Wrong password for that key")
      # 这里把两者的 \r\n 全部去掉后写回环境变量,彻底免疫这个手滑。
      # shell: bash 保证在 Windows runner 上也用 bash(默认是 pwsh)。
      - name: 规整更新签名私钥与密码(去除换行)
        shell: bash
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=$(printf '%s' "$RAW_SIGNING_KEY" | tr -d '\r\n')" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$(printf '%s' "$RAW_SIGNING_PASSWORD" | tr -d '\r\n')" >> "$GITHUB_ENV"

      - name: 构建(并在推送 v* tag 时发布 Release)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 更新签名(全平台都用到):TAURI_SIGNING_PRIVATE_KEY 与
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD 均由上一步规整后经 $GITHUB_ENV 注入
          # (不在此处重复声明,否则会覆盖掉规整后的值)。
          # createUpdaterArtifacts:true 时会额外产出 macOS 的 .app.tar.gz。
          # 公钥写在 tauri.conf.json,客户端用它校验下载的更新包未被篡改。
          # ↓ 仅 macOS 用到;非 mac runner 上 tauri-action 会忽略这些值
          # 代码签名:Developer ID Application 证书(.p12 → base64)+ 导出密码 + 签名身份
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 公证:App Store Connect API Key(Issuer ID + Key ID + 上一步写出的 .p8 路径)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          # 仅在「推送 tag」时传 tagName,触发发布到 Release;
          # 手动 Run 时为空字符串,tauri-action 只构建、不上传(避免与旧草稿撞名)
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('FishReader {0}', github.ref_name) || '' }}
          releaseBody: "查看下方 Assets 下载对应平台安装包。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 每次构建都把安装包存为 workflow 产物(手动触发也能在运行页下载,永不撞名)
      - name: 上传安装包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm

  # ===================================================================
  # 收尾:汇总三平台产物 → 生成 latest.json → 上传到阿里云 OSS。
  # 仅在「推送 v* tag」时运行(手动 Run 只构建,不发布)。
  # 用户客户端只访问 OSS,国内直连无需翻墙。
  # ===================================================================
  publish-oss:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 把三平台 build job 上传的产物(安装包 + .sig + macOS .app.tar.gz)下载到一起
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 计算「更新说明」(展示给终端用户,务必干净):
      #   1) 若仓库有 RELEASE_NOTES.md → 用它的全文(推荐:在这里写正式更新日志)
      #   2) 否则取提交主题(首行)—— 天然排除正文与 Co-Authored-By 等尾注 ——
      #      再去掉 "release: vX.Y.Z —" 前缀
      - name: 计算更新说明
        shell: bash
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            NOTES=$(cat RELEASE_NOTES.md)
          else
            NOTES=$(git log -1 --pretty=%s)
            NOTES=$(printf '%s' "$NOTES" | sed -E 's/^release:?[[:space:]]*v?[0-9]+(\.[0-9]+)*[[:space:]]*//')
            NOTES=$(printf '%s' "$NOTES" | sed -E 's/^—[[:space:]]*//; s/^[:-][[:space:]]*//')
          fi
          [ -z "$NOTES" ] && NOTES='本次更新包含若干改进与修复。'
          {
            echo "RELEASE_NOTES<<__EOF__"
            echo "$NOTES"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
          echo "更新说明 → $NOTES"

      # 生成两份清单:
      #   latest.json    —— 客户端自动更新用(mac 指向 .app.tar.gz)
      #   downloads.json —— 官网下载页用(mac 指向 .dmg,面向首次安装)
      - name: 生成 latest.json / downloads.json
        run: |
          node scripts/gen-latest-json.mjs \
            --dir artifacts \
            --version "${{ github.ref_name }}" \
            --base "https://moyulao.oss-cn-beijing.aliyuncs.com/updates" \
            --out artifacts/latest.json \
            --downloads-out artifacts/downloads.json \
            --notes "$RELEASE_NOTES"

      # 安装 ossutil:直接下载 v1 官方二进制到工作目录。
      # 不用官方 install.sh —— 它会把二进制 cp 到 /usr/bin,而 runner 非 root,
      # 会报 "Permission denied"。直链下载 + chmod 即可,无需 sudo。
      - name: 安装 ossutil
        run: |
          curl -fsSL -o ossutil64 https://gosspublic.alicdn.com/ossutil/1.7.18/ossutil64
          chmod +x ossutil64
          ./ossutil64 --version

      # 配置 OSS 凭证(RAM 子账号,仅授予该 bucket 写权限)
      - name: 配置 ossutil
        run: |
          ./ossutil64 config \
            -e oss-cn-beijing.aliyuncs.com \
            -i "${{ secrets.OSS_ACCESS_KEY_ID }}" \
            -k "${{ secrets.OSS_ACCESS_KEY_SECRET }}"

      # 上传:安装包 + .sig → updates/<tag>/;latest.json → updates/(覆盖)
      - name: 上传到 OSS
        run: |
          VER="${{ github.ref_name }}"
          # 把所有安装包与签名平铺上传到版本目录
          find artifacts -type f \( \
            -name '*-setup.exe' -o -name '*-setup.exe.sig' \
            -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \
            -o -name '*.AppImage' -o -name '*.AppImage.sig' \
            -o -name '*.deb' \) -print0 \
          | while IFS= read -r -d '' f; do
              ./ossutil64 cp -f "$f" "oss://moyulao/updates/${VER}/$(basename "$f")"
            done
          # 最后覆盖两份清单(覆盖式,始终指向最新版)
          ./ossutil64 cp -f artifacts/latest.json "oss://moyulao/updates/latest.json"
          ./ossutil64 cp -f artifacts/downloads.json "oss://moyulao/updates/downloads.json"
