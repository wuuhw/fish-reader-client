name: Release

# 触发方式:
#   1. 推送形如 v0.1.0 的 tag 时自动构建并发布 Release
#   2. 在 GitHub 网页 Actions 页手动点击运行(workflow_dispatch)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 允许 workflow 创建 Release(上传安装包)
permissions:
  contents: write

# 让 checkout/setup-node/pnpm 等 action 用 Node 24 运行时,消除 Node 20 弃用警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS:同时产出 Apple Silicon + Intel 的通用包
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Windows:只用 NSIS 产出 .exe 安装器
          # (中文产品名「小豆」会让 WiX 的 .msi 打包步骤 light.exe 失败,故跳过 msi)
          - platform: windows-latest
            args: "--bundles nsis"
          # Linux:产出 .AppImage / .deb
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4

      # Linux 端 Tauri 需要的系统依赖(WebKitGTK 等)
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用包需要同时安装两个架构的 target
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # 缓存 Rust 编译产物,加速后续构建
      - name: 缓存 Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      # 仅 macOS:把 App Store Connect API Key(.p8,base64 存在 secret 里)写成文件,
      # 供公证使用;路径通过 GITHUB_ENV 传给后续步骤。
      - name: 准备 macOS 公证 API Key
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPLE_API_KEY_P8 }}" | base64 --decode > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"

      - name: 构建(并在推送 v* tag 时发布 Release)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ↓ 仅 macOS 用到;非 mac runner 上 tauri-action 会忽略这些值
          # 代码签名:Developer ID Application 证书(.p12 → base64)+ 导出密码 + 签名身份
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # 公证:App Store Connect API Key(Issuer ID + Key ID + 上一步写出的 .p8 路径)
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          # 仅在「推送 tag」时传 tagName,触发发布到 Release;
          # 手动 Run 时为空字符串,tauri-action 只构建、不上传(避免与旧草稿撞名)
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('小豆 {0}', github.ref_name) || '' }}
          releaseBody: "查看下方 Assets 下载对应平台安装包。"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 每次构建都把安装包存为 workflow 产物(手动触发也能在运行页下载,永不撞名)
      - name: 上传安装包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/**/release/bundle/nsis/*-setup.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/appimage/*.AppImage
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/rpm/*.rpm
